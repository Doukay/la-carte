# Les tests sur Linux et Windows, avec chaque version de Node. Seulement à la demande (Actions, Tests,
# Run workflow) : au quotidien ils tournent sur le PC. Rien à installer : le lanceur intégré à Node.
name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
