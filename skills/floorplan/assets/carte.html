<script>
/* Thème : s'exécute avant tout affichage pour que la page ne clignote jamais avec les mauvaises couleurs. « auto » suit l'appareil. */
(() => {
  const CLE = 'floorplan-theme', racine = document.documentElement, mq = matchMedia('(prefers-color-scheme: light)');
  let memoire = 'light';
  const valide = (v) => v === 'auto' || v === 'light' || v === 'dark';
  const lire = () => { try { const v = localStorage.getItem(CLE); if (valide(v)) return v; } catch (e) {} return memoire; };
  const appliquer = () => {
    const c = lire();
    racine.setAttribute('data-theme', c === 'auto' ? (mq.matches ? 'light' : 'dark') : c);
    window.dispatchEvent(new Event('floorplan-theme-change'));
  };
  appliquer();
  if (mq.addEventListener) mq.addEventListener('change', appliquer); else if (mq.addListener) mq.addListener(appliquer);
  addEventListener('storage', (e) => { if (e.key === CLE || e.key === null) appliquer(); }); // modifié dans un autre onglet
  window.floorplanTheme = { get: lire, set: (c) => {
    if (!valide(c)) return;
    memoire = c; try { localStorage.setItem(CLE, c); } catch (e) {}
    racine.classList.add('theme-switching'); appliquer();
    requestAnimationFrame(() => requestAnimationFrame(() => racine.classList.remove('theme-switching')));
  } };
})();
</script>

/* le bouton Thème ajoute 48 px (44 px et un espace) du côté droit, donc la zone de recherche cède autant, et le nom du projet et les boutons tiennent comme avant. Sous 701 px, la barre relève de la disposition téléphone et reste telle quelle. */

.desc[style*="--lines:1"] { -webkit-line-clamp: 1; } .desc[style*="--lines:2"] { -webkit-line-clamp: 2; } .desc[style*="--lines:3"] { -webkit-line-clamp: 3; }

.card.recent { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--recent) 62%, transparent), var(--shadow-card); }

/* ---------- liens ---------- */
.edges { animation: fadeIn .7s var(--ease) .12s both; }

.edge .hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }
.edge .port { fill: var(--bg); stroke: currentColor; stroke-width: 1.5; transition: opacity .25s var(--ease); }
.edge.k-config .trace { stroke-dasharray: 5 5; }

.edge:hover .trace, .edge.hl .trace { stroke-opacity: 1; }
.edge:hover .flow, .edge.hl .flow { opacity: .95; animation: flow 1.1s linear infinite; }

@keyframes menuIn { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
#flowmenu, #legend { top: 44px; right: 0; width: 320px; }
#flowmenu .r { padding: 10px 12px; border-radius: 12px; cursor: pointer; transition: background .15s var(--ease); }
#flowmenu .r:hover { background: rgba(var(--ink), .07); }
#flowmenu .r b { font-weight: 500; display: block; }
#flowmenu .r span { color: var(--text-3); font-size: 12.5px; }
#flowmenu .r.custom { display: flex; gap: 8px; align-items: flex-start; }
#flowmenu .r.custom .rt { flex: 1; min-width: 0; }
#flowmenu .r .del { border: 0; background: none; color: var(--text-4); border-radius: 999px; width: 26px; height: 26px; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .15s var(--ease), background .15s var(--ease); flex: none; }
#flowmenu .r:hover .del { opacity: 1; }
#flowmenu .r .del:hover { background: rgba(var(--ink), .1); color: var(--text); }
#flowmenu .yours { font-size: 11px; color: var(--text-3); background: rgba(var(--ink), .06); border-radius: 999px; padding: 1px 7px; margin-left: 6px; font-weight: 400; }
#flowmenu .new { display: flex; align-items: center; gap: 10px; color: var(--text); }
#flowmenu .new svg { color: var(--text-3); }
.ff { padding: 8px 6px 6px; }
.ff label { display: block; font-size: 12.5px; color: var(--text-3); padding: 2px 6px 8px; }
.ff textarea { width: 100%; min-height: 84px; resize: none; background: rgba(var(--ink), .05); border: 0; border-radius: 14px; padding: 11px 13px; color: var(--text); outline: none; font: inherit; line-height: 1.5; transition: background .2s var(--ease), box-shadow .2s var(--ease); }
.ff textarea:focus { background: rgba(var(--ink), .07); box-shadow: 0 0 0 1px rgba(var(--ink), .14); }
.ff .ffa { display: flex; justify-content: flex-end; gap: 6px; margin-top: 10px; }
.ff .ffa .btn { height: 34px; }
.ff .note { font-size: 12px; color: var(--text-4); padding: 8px 6px 0; }
#legend { width: 250px; }
#legend .lh { padding: 8px 12px 6px; font-size: 12px; color: var(--text-3); }
#legend label { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; cursor: pointer; color: var(--text); user-select: none; transition: background .15s var(--ease); }
#legend label:hover { background: rgba(var(--ink), .07); }
#legend label.off { color: var(--text-4); }
#legend label.off .sw { opacity: .25; }
#legend input { display: none; }
#legend .sw { width: 16px; height: 3px; border-radius: 2px; }
#legend .n { margin-left: auto; color: var(--text-3); font-variant-numeric: tabular-nums; font-size: 12px; }
#legend .tog { width: 28px; height: 16px; border-radius: 999px; background: rgba(var(--ink), .12); position: relative; transition: background .2s var(--ease); flex: none; }
#legend .tog::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--text-3); transition: transform .25s var(--ease), background .2s var(--ease); }
#legend label:not(.off) .tog { background: rgba(var(--ink), .28); }
#legend label:not(.off) .tog::after { transform: translateX(12px); background: var(--on-hover); }
#ctxmenu { position: fixed; display: block; transform-origin: top left; }
#ctxmenu[hidden] { display: none; }
#ctxmenu:not([hidden]) { animation: menuIn .18s var(--ease); }
.mi { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-radius: 12px; background: none; cursor: pointer; color: var(--text); text-align: left; font-size: 13px; transition: background .15s var(--ease); }
.mi:hover { background: rgba(var(--ink), .08); }
.mi svg { color: var(--text-3); }
.mi .hint { margin-left: auto; color: var(--text-4); font-size: 12px; }
.mi-sep { height: 1px; background: var(--hair); margin: 5px 8px; }
.mi-title { padding: 8px 12px 6px; font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
#flowbar { position: absolute; left: calc((100% - var(--pw)) / 2); top: calc(var(--hh, 64px) + 12px); transform: translateX(-50%); width: min(680px, calc(100% - var(--pw) - 48px)); padding: 14px 14px 14px 20px; display: flex; gap: 12px; align-items: center; z-index: 3; border-radius: var(--r-panel); animation: sheetIn .4s var(--ease); transition: left .45s var(--ease); }
#flowbar[hidden] { display: none; }
#flowbar .fk { font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
#flowbar .ft { flex: 1; min-width: 0; line-height: 1.5; }
#flowbar .ft b { font-weight: 600; }
#flowbar .ft span { color: var(--text-2); }
#flowbar .dots { display: flex; gap: 4px; margin-top: 8px; }
#flowbar .dots i { width: 18px; height: 3px; border-radius: 2px; background: rgba(var(--ink), .12); transition: background .3s var(--ease); }
#flowbar .dots i.on { background: var(--on); }
#tooltip { position: absolute; pointer-events: none; padding: 11px 13px; max-width: 320px; z-index: 6; font-size: 12.5px; line-height: 1.5; border-radius: 16px; animation: tipIn .2s var(--ease); }
@keyframes tipIn { from { opacity: 0; transform: translateY(3px); } }
#tooltip[hidden] { display: none; }
#tooltip .tt { font-weight: 600; }
#tooltip .td { color: var(--text-2); }
#tooltip .tp { color: var(--text-3); font-family: var(--mono); font-size: 11.5px; margin-top: 4px; word-break: break-all; white-space: pre-line; }
#tooltip .th { display: flex; gap: 10px; margin-top: 8px; color: var(--text-3); font-size: 11.5px; }
#tooltip .trw { margin-top: 9px; padding: 8px 10px; border-radius: 11px; background: color-mix(in srgb, var(--recent) 9%, transparent); }
#tooltip .trh { display: flex; align-items: center; gap: 6px; color: var(--recent); font-size: 11.5px; font-weight: 600; }
#tooltip .trh::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
#tooltip .trn { color: var(--text); margin-top: 3px; }
#tooltip .th span { display: inline-flex; gap: 5px; align-items: center; }
#loading { position: absolute; left: calc((100% - var(--pw)) / 2); top: 50%; transform: translate(-50%, -50%); padding: 10px 16px; border-radius: 999px; font-size: 12.5px; color: var(--text-2); opacity: 0; transition: opacity .3s var(--ease); pointer-events: none; }
#loading.on { opacity: 1; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); pointer-events: none; }

/* ---------- panneau de détails (flottant) ---------- */
#panel { position: fixed; top: calc(var(--hh, 64px) + 4px); right: 16px; bottom: 16px; width: var(--panel-w); border-radius: var(--r-panel); overflow: auto; z-index: 5;
  background: var(--elev); box-shadow: var(--shadow-float);
  transition: transform .45s var(--ease), opacity .3s var(--ease); }
body.no-panel #panel { transform: translateX(24px) scale(.98); opacity: 0; pointer-events: none; }
#panel-resize { position: fixed; top: calc(var(--hh, 64px) + 20px); bottom: 32px; right: calc(var(--panel-w) + 16px - 6px); width: 12px; cursor: ew-resize; z-index: 6; display: grid; place-items: center; transition: opacity .3s var(--ease); }
#panel-resize::after { content: ""; width: 4px; height: 40px; border-radius: 999px; background: rgba(var(--ink), .14); opacity: 0; transition: opacity .2s var(--ease), height .25s var(--ease), background .2s var(--ease); }
#panel-resize:hover::after, body.resizing #panel-resize::after { opacity: 1; height: 64px; }
body.resizing #panel-resize::after { background: rgba(var(--ink), .4); }
body.resizing, body.resizing * { cursor: ew-resize !important; user-select: none; }
body.resizing #panel, body.resizing #ask, body.resizing #flowbar { transition: none; }
body.exported #ask { display: none; }
#madewith { position: absolute; left: calc((100% - var(--pw)) / 2); bottom: 20px; transform: translateX(-50%); z-index: 4; display: inline-flex; align-items: center; gap: 8px; padding: 8px 15px 8px 12px; border-radius: 999px; font-size: 12.5px; color: var(--text-3); text-decoration: none; white-space: nowrap; transition: left .45s var(--ease), color .15s var(--ease); }
#madewith b { color: var(--text); font-weight: 600; }
#madewith:hover { color: var(--text); }
@media (max-width: 700px) { #madewith .x { display: none; } }
.xtag { font-size: 11.5px; font-weight: 500; color: var(--text-3); background: rgba(var(--ink), .06); border-radius: 999px; padding: 3px 9px; margin-left: 8px; white-space: nowrap; cursor: default; }
body.no-panel #panel-resize { opacity: 0; pointer-events: none; }
#panel::-webkit-scrollbar { width: 12px; } #panel::-webkit-scrollbar-thumb { background: rgba(var(--ink), .1); border-radius: 10px; border: 4px solid transparent; background-clip: padding-box; }
#panel > * { animation: panelIn .4s var(--ease) both; }
@keyframes panelIn { from { opacity: 0; transform: translateY(6px); } }
.sec { padding: 18px 20px 6px; }
.sec:first-child { padding-top: 22px; }
.sec:last-child { padding-bottom: 22px; }
.sec h3 { margin: 0 0 8px; font-size: 12.5px; font-weight: 500; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.sec h3 .c { color: var(--text-4); }
.ph { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.ph .kindlabel { font-size: 12.5px; color: var(--text-3); display: inline-block; }
.ph .kindlabel::first-letter, .td-genre::first-letter { text-transform: uppercase; }
.pt { margin: 0 0 6px; font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; word-break: break-word; }
.pd { margin: 0; color: var(--text-2); line-height: 1.6; }
.pd.empty { color: var(--text-4); }
.pp { display: flex; align-items: center; gap: 6px; margin-top: 14px; font-family: var(--mono); font-size: 11.5px; color: var(--text-3); background: rgba(var(--ink), .04); border-radius: 12px; padding: 8px 10px 8px 12px; word-break: break-all; }
.pp button { margin-left: auto; background: none; border: 0; color: var(--text-3); cursor: pointer; padding: 4px; display: grid; border-radius: 8px; transition: background .2s var(--ease), color .2s var(--ease); }
.pp button:hover { color: var(--text); background: rgba(var(--ink), .08); }
.actions { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.actions .btn { height: 34px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: rgba(var(--ink), .04); border-radius: 14px; padding: 10px 12px; }
.stats b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.stats span { font-size: 12px; color: var(--text-3); }
.bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; margin: 14px 0 10px; gap: 3px; }
.bar span { border-radius: 999px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; flex: none; }
.list { display: flex; flex-direction: column; gap: 2px; margin: 0 -10px; }
.row { display: flex; align-items: flex-start; gap: 12px; padding: 9px 10px; border-radius: 14px; cursor: pointer; text-decoration: none; color: inherit; transition: background .15s var(--ease); }
.row:hover { background: rgba(var(--ink), .06); }
.row .dot { margin-top: 6px; }
.row .rt { flex: 1; min-width: 0; }
.row .rn { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rd { color: var(--text-3); font-size: 12.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
.row .rp { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rc { font-size: 12px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.more { color: var(--text-4); font-size: 12.5px; padding: 6px 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); background: rgba(var(--ink), .05); border-radius: 999px; padding: 3px 10px; }
.callout { margin-top: 14px; padding: 11px 13px; border-radius: 14px; background: var(--warn-bg); color: var(--warn-text); font-size: 13px; line-height: 1.55; }

/* ---------- palette de commandes ---------- */
#palette { position: fixed; inset: 0; z-index: 40; background: var(--scrim); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding-top: 14vh; }
#palette.open { display: flex; animation: fadeIn .2s var(--ease); }
#palette .box { width: min(640px, calc(100% - 32px)); overflow: hidden; border-radius: var(--r-panel); animation: menuIn .3s var(--ease); background: var(--palette-bg); }
#palette .in { display: flex; align-items: center; gap: 12px; padding: 0 20px; color: var(--text-3); }
#palette input { flex: 1; height: 58px; background: none; border: 0; outline: none; font-size: 16px; color: var(--text); }
#results { max-height: 52vh; overflow: auto; padding: 0 8px 8px; }
#results .r { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; cursor: pointer; }
#results .r.active { background: rgba(var(--ink), .07); }
#results .r .rt { flex: 1; min-width: 0; }
#results .r .rn { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#results .r .rd { color: var(--text-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#results .r .rk { font-size: 12px; color: var(--text-4); white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
#results .empty { padding: 22px; color: var(--text-3); text-align: center; }
#palette .hint { display: flex; gap: 16px; padding: 12px 20px; color: var(--text-4); font-size: 12px; background: rgba(var(--ink), .02); }

/* ---------- bulle de questions ---------- */
#ask { position: absolute; left: calc((100% - var(--pw)) / 2); bottom: 20px; transform: translateX(-50%); width: min(700px, calc(100% - var(--pw) - 320px)); min-width: 320px; z-index: 4; display: flex; flex-direction: column; gap: 10px; transition: left .45s var(--ease), width .45s var(--ease); }
#ask-form { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 18px; border-radius: 28px; transition: box-shadow .25s var(--ease); flex-wrap: wrap; }
#ask-form:focus-within { box-shadow: 0 0 0 1px rgba(var(--ink), .16), var(--shadow-deep); }
#ask-chips { display: contents; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 6px 0 8px; border-radius: 999px; background: rgba(var(--ink), .08); font-size: 12.5px; max-width: 220px; animation: chipIn .3s var(--ease); }
@keyframes chipIn { from { opacity: 0; transform: scale(.9); } }
.chip .ico { width: 20px; height: 20px; border-radius: 999px; }
.chip .ico svg { width: 11px; height: 11px; }
.chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip button { border: 0; background: none; color: var(--text-3); cursor: pointer; width: 20px; height: 20px; border-radius: 999px; display: grid; place-items: center; flex: none; }
.chip button:hover { background: rgba(var(--ink), .1); color: var(--text); }
/* l'interrupteur Demander / Modifier d'un plan */
#ask-mode { display: inline-flex; flex: none; gap: 2px; padding: 3px; margin-left: -10px; border-radius: 999px; background: rgba(var(--ink), .06); }
#ask-mode button { border: 0; background: none; color: var(--text-3); font: inherit; font-size: 12.5px; font-weight: 500; height: 28px; padding: 0 12px; border-radius: 999px; cursor: pointer; transition: background .15s var(--ease), color .15s var(--ease); }
#ask-mode button:hover { color: var(--text); }
#ask-mode button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .18); }
#ask-mode button:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
#ask-input { flex: 1; min-width: 160px; height: 38px; background: none; border: 0; outline: none; font-size: 15px; color: var(--text); }
#ask-input::placeholder { color: var(--text-3); }
#ask-input:disabled { cursor: not-allowed; }
.engine { font-size: 12px; color: var(--text-3); background: rgba(var(--ink), .05); border-radius: 999px; padding: 4px 10px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.engine i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-4); }
.engine.ok i { background: var(--ok); box-shadow: 0 0 8px color-mix(in srgb, var(--ok) 80%, transparent); }
.engine.warn { color: var(--warn-text); background: var(--warn-bg); }
.engine.warn i { background: var(--sev-medium); }
.einfo { background: none; border: 0; padding: 0; margin-left: 1px; color: var(--text-3); cursor: pointer; display: grid; }
.einfo:hover { color: var(--text); }
.einfo svg { width: 14px; height: 14px; }
#ask-send { width: 38px; height: 38px; border-radius: 999px; border: 0; background: var(--on); color: var(--on-text); cursor: pointer; display: grid; place-items: center; flex: none; transition: transform .2s var(--ease), background .2s var(--ease), opacity .2s; }
#ask-send:hover:not(:disabled) { transform: scale(1.06); background: var(--on-hover); }
#ask-send:disabled { background: rgba(var(--ink), .1); color: var(--text-4); cursor: default; }
#ask-send.stop { background: rgba(var(--ink), .14); color: var(--text); }
#ask-warn { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; border-radius: 20px; font-size: 13px; line-height: 1.5; color: var(--warn-text); background: var(--warn-sheet); backdrop-filter: blur(16px); animation: sheetIn .35s var(--ease); }
#ask-warn[hidden] { display: none; }
#ask-warn.info { color: var(--text-2); background: var(--elev); box-shadow: var(--shadow-float); }
#ask-warn code { font-family: var(--mono); font-size: 12px; background: var(--well); padding: 1px 7px; border-radius: 7px; color: var(--text); }
#ask-warn.info code { background: rgba(var(--ink), .07); }
#ask-warn a { color: inherit; text-underline-offset: 3px; }
#ask-warn.info a { color: var(--text); }
#ask-warn button { margin-left: auto; background: rgba(var(--ink), .08); border: 0; color: inherit; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
#ask-warn button:hover { background: rgba(var(--ink), .14); }
#ask-sheet { max-height: min(46vh, 480px); display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r-panel); animation: sheetIn .45s var(--ease); }
@keyframes sheetIn { from { opacity: 0; transform: translateY(12px) scale(.985); } }
#ask-sheet[hidden] { display: none; }
#ask-sheet .sh { display: flex; align-items: center; gap: 6px; padding: 12px 12px 4px 20px; }
#ask-sheet .sh .q { flex: 1; min-width: 0; color: var(--text-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ask-sheet .sh .btn { height: 32px; }
#ask-sheet .sb { padding: 6px 20px 18px; overflow: auto; line-height: 1.65; color: var(--text); font-size: 14px; }
#ask-sheet .sb p { margin: 0 0 10px; }
#ask-sheet .sb ul, #ask-sheet .sb ol { margin: 0 0 10px; padding-left: 20px; }
#ask-sheet .sb li { margin: 3px 0; }
#ask-sheet .sb code { font-family: var(--mono); font-size: 12.5px; background: rgba(var(--ink), .07); padding: 1px 6px; border-radius: 6px; }
#ask-sheet .sb strong { font-weight: 600; }
.ref { display: inline-flex; align-items: center; gap: 6px; padding: 0 9px 0 7px; border-radius: 999px; background: rgba(var(--ink), .08); color: var(--text); cursor: pointer; font-weight: 500; font-size: 13px; line-height: 23px; white-space: nowrap; vertical-align: 1px; transition: background .2s var(--ease); }
.ref:hover { background: rgba(var(--ink), .15); }
.ref i { width: 7px; height: 7px; border-radius: 999px; background: var(--c); }
.progress { display: flex; flex-direction: column; gap: 7px; font-size: 13px; color: var(--text-3); }
.progress div { display: flex; align-items: center; gap: 10px; animation: chipIn .3s var(--ease); }
.progress div:last-child { color: var(--text); }
.spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(var(--ink), .15); border-top-color: var(--on); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.followups { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.followups button { background: rgba(var(--ink), .06); border: 0; color: var(--text-2); border-radius: 999px; padding: 7px 13px; cursor: pointer; font-size: 12.5px; text-align: left; transition: background .2s var(--ease), color .2s var(--ease); }
.followups button:hover { background: rgba(var(--ink), .11); color: var(--text); }
.sheet-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.err { color: var(--err-text); }

/* ---------- interface des extensions : emplacement d'en-tête, fenêtre, message, listes groupées ---------- */
.hr-ext { display: contents; }
#modal { position: fixed; inset: 0; z-index: 45; background: var(--scrim-2); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 24px; }
#modal.open { display: flex; animation: fadeIn .2s var(--ease); }
#modal .box { width: min(620px, 100%); max-height: min(80vh, 760px); overflow: auto; border-radius: var(--r-panel); background: var(--modal-bg); animation: menuIn .3s var(--ease); padding: 22px 24px 20px; }
#modal h2 { margin: 0 0 8px; font-size: 18px; font-weight: 600; letter-spacing: -.015em; }
#modal .mb { color: var(--text-2); line-height: 1.6; }

    if (!e) { e = { id: 'e' + agg.size, a, b, k: l.k, w: 0, links: [] }; agg.set(cle, e); }

  for (const l of G.links) {
    if (!etatVue.kinds[l.k]) continue;
    if (estFichier) {
      const fid = conteneur, f = fichiersParChemin.get(fid.slice(2));
      if (l.b === fid && l.a !== fid) {
        const pa = projeter(l.a, ctx); if (!pa?.outside) continue;
        const src = connecteur('in', pa.outside);
        if (l.calls?.length) { let trouve = false; for (const [ri] of l.calls) if (ri != null && ctx.vis.has('r:' + ri)) { ajouter(src, 'r:' + ri, l, 1); trouve = true; } if (!trouve) ajouter(src, 'm:' + f.p, l); continue; }
        const cibles = new Set();
        for (const nm of l.names || []) { const i = (f.s || []).findIndex((s) => nm === 'default' ? s[3] : s[0] === nm); if (i >= 0 && ctx.vis.has(`s:${f.p}#${i}`)) cibles.add(`s:${f.p}#${i}`); }
        if (!cibles.size) cibles.add('m:' + f.p);
        for (const t of cibles) ajouter(src, t, l);
      } else if (l.a === fid && l.b !== fid) {
        const pb = projeter(l.b, ctx); if (!pb?.outside) continue;
        const dst = connecteur('out', pb.outside);
        if (l.calls?.length) { for (const [, ligne] of l.calls) ajouter(symboleEnglobant(f, ligne) || 'm:' + f.p, dst, l, 1); continue; }
        ajouter('m:' + f.p, dst, l);

    }

    if (!pa || !pb) continue;
    if (pa.item && pb.item) { if (pa.item !== pb.item) ajouter(pa.item, pb.item, l); }
    else if (pa.item && pb.outside) ajouter(pa.item, connecteur('out', pb.outside), l);

    const garder = visibles.filter((v) => v.startsWith('m:') || utilises.has(v));

}

// ======================= blocs =======================
// Les blocs ne montrent que ce qu'on lit d'un coup d'œil : pictogramme, nom, description, un seul compte. Les chemins, types et
// tailles sont dans l'infobulle au survol et dans le panneau de détails.
// [largeur, hauteur minimale]
const TAILLES = { node: [300, 140], dir: [272, 120], file: [284, 120], module: [284, 120], route: [300, 140], symbol: [260, 108] };
const HAUTEUR_NOTE = 64;
const HAUTEUR_PIED = 30;   // la ligne du pied : taille à gauche, pastille de travail récent à droite
const HAUTEUR_TITRE2 = 10; // un titre qui passe sur une deuxième ligne
const MARGE = 28; // place autour de chaque bloc pour son ombre, son anneau de sélection et son soulèvement au survol (correspond à --gutter)
/** Éléments du pied : la taille du bloc (modules / fichiers / adresses du serveur) et sa pastille de travail récent. Vide si aucun ne s'applique. */
function piedBloc(element) {
  const i = infosBloc(element);
  let taille = '';
  if (i.type === 'node' && i.n.kind !== 'external') { const sous = (fils.get(element) || []).filter((k) => k.startsWith('n:')).length; taille = sous ? accorder(sous, 'module') : accorder(statsDe(element).files, 'fichier'); }
  else if (i.type === 'dir') taille = accorder(statsDe(element).files, 'fichier');
  else if (i.type === 'module') taille = 'ce fichier';
  else if (i.type === 'file') { const nr = (routesParFichier.get(i.f.p) || []).length; taille = nr ? accorder(nr, 'adresse') + ' du serveur' : ''; }
  const recents = recentsDe(element), dedans = recentsDans.get(element.startsWith('m:') ? 'f:' + element.slice(2) : element);
  const pastille = recents ? `<span class="rw">${libelleRecent(recents)}</span>` : dedans ? `<span class="rw soft">${dedans.length} modifiés</span>` : '';
  return taille || pastille ? `<div class="foot">${taille ? `<span class="meta">${taille}</span>` : '<span></span>'}${pastille}</div>` : '';
}
/** Hauteur supplémentaire dont un bloc a besoin au-delà de sa taille de base : un pied, et un titre assez long pour passer à la ligne. */
function hauteurSupplementaireBloc(element) {
  const i = infosBloc(element);
  const [w] = TAILLES[i.type] || TAILLES.file;
  const nom = i.type === 'route' ? i.r.name : i.type === 'symbol' ? i.s[0] : i.name;
  const place = w - 36 - (i.type === 'route' ? 0 : 40); // marges, et le pictogramme à côté du titre
  return (piedBloc(element) ? HAUTEUR_PIED : 0) + (largeurTexte(nom, 16, 600) > place ? HAUTEUR_TITRE2 : 0);
}
function blocHTML(element) {
  const i = infosBloc(element);
  let tete = '', titre = '', desc = '', cls = i.type;
  const dsc = (t, lignes = 2) => t ? `<div class="desc" style="--lines:${lignes}">${h(t)}</div>` : `<div class="desc empty">Pas encore de description</div>`;
  if (i.type === 'node') {
    const n = i.n;
    if (n.kind === 'external') cls += ' external';
    tete = `<span class="ico">${picto(clePicto(i))}</span><div class="title">${h(n.label)}</div>`;
    desc = dsc(n.summary, 3);
  } else if (i.type === 'dir') {
    tete = `<span class="ico">${picto('dir')}</span><div class="title">${h(i.name)}</div>`;
    desc = dsc(i.d.files.slice().sort((a, b) => b.loc - a.loc).slice(0, 4).map((f) => f.name).join(', ') + (i.d.files.length > 4 ? ', …' : ''), 2);
  } else if (i.type === 'file' || i.type === 'module') {
    const f = i.f;
    if (f.note) cls += ' has-note';
    tete = `<span class="ico">${picto(clePicto(i))}</span><div class="title">${h(f.name)}</div>`;
    desc = dsc(f.d, 2);
  } else if (i.type === 'route') {
    const r = i.r;
    tete = `<span class="method" style="--m:${varMethode(r.m)}">${h(r.m)}</span><span class="rpath">${h(r.p)}</span>`;
    titre = `<div class="title">${h(r.name)}</div>`;

  } else if (i.type === 'symbol') {
    tete = `<span class="ico">${picto(i.kind)}</span><div class="title mono">${h(i.s[0])}</div>`;

  if (recentsDe(element)) cls += ' recent';

}
function connecteurHTML(c) {

/** Infobulle d'un bloc au survol : ce que c'est, où il se trouve, et ce qu'on peut en faire. */
function infobulleBloc(id) {
  if (id.startsWith('x:')) {
    const i = infosBloc(entiteConnecteur(id));
    return `<div class="tt">${id.startsWith('x:in') ? 'De' : 'Vers'} ${h(i.name)}</div>${i.desc ? `<div class="td">${h(i.desc)}</div>` : ''}<div class="th"><span><span class="kbd">2×clic</span> y aller</span><span><span class="kbd">clic droit</span> plus</span></div>`;
  }
  const i = infosBloc(id);
  const st = statsDe(id);

  const endroit = i.type === 'node' ? (i.n.paths || []).join('\n') : i.type === 'route' ? `${i.f.p}${i.r.h ? ` · ${i.r.h}()` : ''}` : i.path || '';

  return `<div class="tt">${h(i.name)}</div><div class="td td-genre">${h(nomGenre(genre))}${taille ? ` · ${taille}` : ''}</div>${endroit ? `<div class="tp">${h(endroit)}</div>` : ''}${infobulleRecent(id)}<div class="th">${indications}</div>`;

/** Lignes au survol pour le travail récent : ce qui a changé sur ce bloc et en quoi cela sert la demande, ou ce qui a changé à l'intérieur. */
function infobulleRecent(id) {
  if (!recentVisible) return '';
  const cle = id.startsWith('m:') ? 'f:' + id.slice(2) : id;
  const tache = (t) => h(tachesRecentes[t]?.title || 'Travail récent');
  const recents = recentsPar.get(cle);
  if (recents) return recents.map((x) => `<div class="trw"><div class="trh">${x.change === 'new' ? 'Nouveau' : 'Modifié'} · ${tache(x.task)}</div>${x.note ? `<div class="trn">${h(x.note)}</div>` : ''}</div>`).join('');

}

// ======================= mise en page =======================
const mesure = document.createElement('canvas').getContext('2d');
const largeurTexte = (s, px = 12, w = 500) => { mesure.font = `${w} ${px}px Inter, system-ui, sans-serif`; return mesure.measureText(s).width; };

async function disposer(vue) {
  const deg = new Map();
  const incrementer = (id) => deg.set(id, (deg.get(id) || 0) + 1);
  for (const e of vue.edges) { incrementer(e.a); incrementer(e.b); }
  const enfantsElk = [];
  for (const element of vue.visible) {
    const [w, hh] = TAILLES[infosBloc(element).type] || TAILLES.file;
    const ext = element.startsWith('n:') && noeudsParId.get(element.slice(2)).kind === 'external';
    enfantsElk.push({ id: element, width: w, height: Math.max(hh + hauteurSupplementaireBloc(element) + (noteReponse(element) ? HAUTEUR_NOTE : 0), (deg.get(element) || 0) * 7 + 28), ...(ext ? { layoutOptions: { 'elk.layered.layering.layerConstraint': 'LAST' } } : {}) });
  }
  for (const c of vue.connectors) {
    enfantsElk.push({ id: c.id, width: borner(largeurTexte(infosBloc(c.entity).name, 13) + 84, 150, 320), height: Math.max(42, (deg.get(c.id) || 0) * 7 + 14),
      layoutOptions: { 'elk.layered.layering.layerConstraint': c.side === 'in' ? 'FIRST_SEPARATE' : 'LAST_SEPARATE' } });
  }
  return elk.layout({
    id: 'g', children: enfantsElk,
    edges: vue.edges.map((e) => ({ id: e.id, sources: [e.a], targets: [e.b] })),
    layoutOptions: {
      'elk.algorithm': 'layered', 'elk.direction': 'RIGHT', 'elk.edgeRouting': 'ORTHOGONAL',
      'elk.layered.spacing.nodeNodeBetweenLayers': '130', 'elk.spacing.nodeNode': '32',
      'elk.layered.spacing.edgeEdgeBetweenLayers': '8', 'elk.spacing.edgeEdge': '8', 'elk.layered.spacing.edgeNodeBetweenLayers': '24',
      'elk.layered.nodePlacement.strategy': 'NETWORK_SIMPLEX', 'elk.layered.considerModelOrder.strategy': 'NODES_AND_EDGES',
      'elk.layered.thoroughness': '12', 'elk.separateConnectedComponents': 'true', 'elk.spacing.componentComponent': '80',
      'elk.padding': '[top=40,left=40,bottom=40,right=40]',
    },
  });
}

// ======================= affichage =======================
function cheminArrondi(points, r = 10) {
  let d = `M${points[0].x},${points[0].y}`;
  for (let i = 1; i < points.length - 1; i++) {
    const a = points[i - 1], b = points[i], c = points[i + 1];
    const d1 = Math.hypot(b.x - a.x, b.y - a.y), d2 = Math.hypot(c.x - b.x, c.y - b.y);
    const rr = Math.min(r, d1 / 2, d2 / 2);
    if (!rr) { d += `L${b.x},${b.y}`; continue; }
    const p1 = { x: b.x + ((a.x - b.x) * rr) / d1, y: b.y + ((a.y - b.y) * rr) / d1 };
    const p2 = { x: b.x + ((c.x - b.x) * rr) / d2, y: b.y + ((c.y - b.y) * rr) / d2 };
    d += `L${p1.x.toFixed(1)},${p1.y.toFixed(1)}Q${b.x},${b.y} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  const z = points[points.length - 1];
  return d + `L${z.x},${z.y}`;
}

let jetonAffichage = 0;
async function afficherVue(options = {}) {
  const jeton = ++jetonAffichage;
  const vue = construireVue(etatVue.container);
  const chargement = setTimeout(() => $('#loading').classList.add('on'), 160);
  let res;
  try { res = await disposer(vue); }
  catch (e) { console.error(e); clearTimeout(chargement); $('#loading').classList.remove('on'); $('#empty').hidden = false; $('#empty').textContent = 'Mise en page impossible : ' + e.message; return; }
  clearTimeout(chargement);
  $('#loading').classList.remove('on');
  if (jeton !== jetonAffichage) return;
  etatVue.view = vue; etatVue.layout = res;
  queueMicrotask(() => emettre('render', { container: etatVue.container, view: vue }));
  dessiner(vue, res);
  rendreColonne(vue, res);
  afficherContexte(); afficherFilAriane(); afficherLegende(vue);
  $('#empty').hidden = vue.visible.length > 0;
  $('#empty').textContent = vue.visible.length ? '' : 'Rien à l\'intérieur.';
  if (options.keepTransform) appliquerTransformation(); else ajusterVue(false);
  appliquerSelection();
  if (options.after) options.after();
}

function dessiner(vue, res) {
  vp.innerHTML = '';
  etatVue.bounds = { x: 0, y: 0, w: res.width, h: res.height };
  const lienParId = new Map(vue.edges.map((e) => [e.id, e]));
  // couches, de bas en haut : traits, effets de parcours (ligne de la visite + pulsation), blocs, points d'accroche
  const gCols = el('g', { class: 'cols' }, vp);
  const gEdges = el('g', { class: 'edges' }, vp), gFx = el('g', {}, vp), gNodes = el('g', {}, vp), gPorts = el('g', { class: 'edges' }, vp);
  etatVue.fxLayer = gFx;
  dessinerColonnes(gCols, vue, res);
  etatVue.edgeEls = new Map(); etatVue.chipEls = new Map();
  for (const re of res.edges || []) {
    const e = lienParId.get(re.id), s = re.sections?.[0];
    if (!s) continue;
    const points = [s.startPoint, ...(s.bendPoints || []), s.endPoint];
    const d = cheminArrondi(points, 14);
    const g = el('g', { class: `edge k-${e.k}`, style: `color:var(--k-${e.k})` }, gEdges);
    const largeur = 1.3 + Math.min(4, Math.log2(e.w + 1)) * 0.5;
    el('path', { class: 'trace', d, 'stroke-width': largeur.toFixed(2) }, g);
    el('path', { class: 'flow', d }, g);
    el('path', { class: 'hit', d }, g);
    const pg = el('g', { class: `edge k-${e.k}`, style: `color:var(--k-${e.k})` }, gPorts);
    el('circle', { class: 'port', cx: s.startPoint.x, cy: s.startPoint.y, r: 3.4 }, pg);
    el('circle', { class: 'port', cx: s.endPoint.x, cy: s.endPoint.y, r: 3.4 }, pg);
    g.addEventListener('mouseenter', (ev) => montrerInfobulle(ev, infobulleLien(e)));
    g.addEventListener('mousemove', deplacerInfobulle);
    g.addEventListener('mouseleave', masquerInfobulle);
    g.addEventListener('click', (ev) => { ev.stopPropagation(); choisir({ edge: e.id }); });
    g.addEventListener('contextmenu', (ev) => { ev.preventDefault(); ev.stopPropagation(); masquerInfobulle(); openMenu(ev, menuLien(e)); });
    etatVue.edgeEls.set(e.id, { g, pg, d, e });
  }
  // les blocs apparaissent de gauche à droite, à quelques millisecondes d'écart
  const ordre = res.children.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const delais = new Map(ordre.map((c, i) => [c.id, Math.min(i * 18, 360)]));
  for (const c of res.children) {
    const g = el('g', { class: 'node', transform: `translate(${c.x},${c.y})` }, gNodes);
    const fo = el('foreignObject', { x: -MARGE, y: -MARGE, width: c.width + MARGE * 2, height: c.height + MARGE * 2 }, g);
    fo.innerHTML = `<div class="fo-pad">${c.id.startsWith('x:') ? connecteurHTML(vue.connectors.find((x) => x.id === c.id)) : blocHTML(c.id)}</div>`;
    fo.querySelector('.card')?.style.setProperty('--d', `${delais.get(c.id)}ms`);
    g.addEventListener('click', (ev) => { ev.stopPropagation(); choisir(c.id); });
    g.addEventListener('dblclick', (ev) => { ev.stopPropagation(); if (ev.button !== 0) return; masquerInfobulle(); ouvrirBloc(c.id); });
    g.addEventListener('contextmenu', (ev) => { ev.preventDefault(); ev.stopPropagation(); masquerInfobulle(); openMenu(ev, menuElement(c.id)); });
    g.addEventListener('mouseenter', (ev) => infobulleDifferee(ev, () => infobulleBloc(c.id)));
    g.addEventListener('mousemove', deplacerInfobulle);
    g.addEventListener('mouseleave', masquerInfobulle);
    etatVue.chipEls.set(c.id, g);
  }
}

/** Accolades au-dessus des trois colonnes d'une vue qui a des connexions extérieures : ce qui utilise cette partie (à gauche),
 *  ce qu'elle contient (au milieu), et ce qu'elle utilise (à droite). Dessinées dans l'espace de la carte pour suivre ses déplacements et son zoom. */
function dessinerColonnes(g, vue, res) {
  if (!vue.connectors?.length || etatVue.container === 'root' || etatVue.container === 'q:answer') return;
  const etendue = (cs) => cs.length ? [Math.min(...cs.map((c) => c.x)), Math.max(...cs.map((c) => c.x + c.width))] : null;
  const entrees = res.children.filter((c) => c.id.startsWith('x:in:'));
  const sorties = res.children.filter((c) => c.id.startsWith('x:out:'));
  const milieu = res.children.filter((c) => !c.id.startsWith('x:'));
  const y = Math.min(...res.children.map((c) => c.y)) - 26;
  const colonnes = [[etendue(entrees), 'Utilisé par'], [etendue(milieu), `À l'intérieur de ${infosBloc(etatVue.container).name}`], [etendue(sorties), 'Utilise']];
  for (const [s, libelle] of colonnes) {
    if (!s) continue;
    const [x0, x1] = s, cx = (x0 + x1) / 2;
    const half = Math.min(largeurTexte(libelle, 13, 500) / 2 + 10, (x1 - x0) / 2 - 12);
    // ⌐—— libellé ——¬ : les bouts du trait s'incurvent vers les blocs, avec une coupure dans la ligne pour le libellé
    el('path', { d: `M${x0},${y + 9} v-5 q0,-4 4,-4 H${cx - half} M${cx + half},${y} H${x1 - 4} q4,0 4,4 v5` }, g);
    el('text', { x: cx, y }, g).textContent = libelle;
  }
}

// ======================= infobulles =======================
const infobulle = $('#tooltip');
let minuterieInfobulle = null, dernierPointeur = null;
// un toucher envoie aussi mouseenter, donc on retient si le dernier pointeur était un doigt : les infobulles au survol sont pour la souris
let toucheEnCours = false;
['pointerdown', 'pointermove'].forEach((t) => window.addEventListener(t, (ev) => { toucheEnCours = ev.pointerType === 'touch'; }, { capture: true, passive: true }));
function montrerInfobulle(ev, html) { clearTimeout(minuterieInfobulle); if (!html || toucheEnCours || glisse?.moved || !$('#ctxmenu').hidden) return; infobulle.innerHTML = html; infobulle.hidden = false; deplacerInfobulle(ev); }
/** Les blocs s'expliquent après un court survol, pour que le simple passage de la souris ne fasse pas clignoter les infobulles. */
function infobulleDifferee(ev, fabriquer) { clearTimeout(minuterieInfobulle); dernierPointeur = ev; minuterieInfobulle = setTimeout(() => montrerInfobulle(dernierPointeur, fabriquer()), 420); }
function deplacerInfobulle(ev) {
  dernierPointeur = ev;
  if (infobulle.hidden) return;
  const r = $('#stage').getBoundingClientRect();
  let x = ev.clientX - r.left + 18, y = ev.clientY - r.top + 18;
  if (x + infobulle.offsetWidth + 12 > r.width) x = ev.clientX - r.left - infobulle.offsetWidth - 14;
  if (y + infobulle.offsetHeight + 12 > r.height) y = ev.clientY - r.top - infobulle.offsetHeight - 14;
  infobulle.style.left = Math.max(8, x) + 'px'; infobulle.style.top = Math.max(8, y) + 'px'; // retournée sur un écran étroit, elle reste quand même à l'écran
}
function masquerInfobulle() { clearTimeout(minuterieInfobulle); infobulle.hidden = true; }
function adressesDe(e) {

  if (sel && estTelephone() && document.body.classList.contains('no-panel')) { reglerPanneau(true); if (typeof sel === 'string') { amenerDansVue(sel); montrerDansColonne(sel); } }
}
function appliquerSelection() {
  const sel = etatVue.selected;
  svg.classList.remove('dim');
  listeColonne.querySelectorAll('.col-bloc.sel').forEach((x) => x.classList.remove('sel'));
  if (typeof sel === 'string') montrerDansColonne(sel);
  for (const g of etatVue.chipEls?.values() || []) g.classList.remove('sel', 'hl');
  for (const { g, pg } of etatVue.edgeEls?.values() || []) { g.classList.remove('hl'); pg.classList.remove('hl'); }
  if (!sel) return;
  const marquer = (x) => { x.g.classList.add('hl'); x.pg.classList.add('hl'); };
  if (typeof sel === 'object' && sel.edge) {
    const x = etatVue.edgeEls.get(sel.edge); if (!x) return;
    svg.classList.add('dim'); marquer(x);
    for (const id of [x.e.a, x.e.b]) etatVue.chipEls.get(id)?.classList.add('hl');
    return;
  }
  const g = etatVue.chipEls?.get(sel); if (!g) return;
  svg.classList.add('dim'); g.classList.add('sel', 'hl');
  for (const x of etatVue.edgeEls.values()) if (x.e.a === sel || x.e.b === sel) { marquer(x); etatVue.chipEls.get(x.e.a === sel ? x.e.b : x.e.a)?.classList.add('hl'); }
}

  if (etatVue.container === 'q:answer') {
    $('#context').innerHTML = `<div class="k"><span class="ico" style="--c:var(--on)">${picto(etatVue.answer.icon || 'spark')}</span>${h(etatVue.answer.kind || 'Réponse')} · ${accorder(etatVue.answer.items.length, 'bloc')}</div><h1>${h(etatVue.answer.title)}</h1><p>${h(etatVue.answer.question)}</p>`;

  }

  const pastilleNombre = etatVue.container === 'root' ? '' : `<span class="ico" style="--c:${couleurBloc(i)}">${picto(clePicto(i))}</span>`;
  $('#context').innerHTML = `${genre ? `<div class="k">${pastilleNombre}${h(genre)}</div>` : ''}<h1>${h(i.name)}</h1>${i.desc ? `<p class="cd" id="ctx-desc">${h(i.desc)}</p>` : ''}${etatVue.view?.hidden ? `<p class="cx" style="color:var(--text-3);font-size:12.5px;margin-top:8px">${etatVue.view.hidden} export(s) de plus ne sont importés nulle part par leur nom ; ils sont listés dans le panneau de détails.</p>` : ''}${i.desc ? '<button type="button" class="ctx-more" aria-controls="ctx-desc" hidden></button>' : ''}`;

/** Sur un téléphone, la description se replie sur une ligne ; le bouton Plus / Moins n'apparaît que s'il y a plus à lire, et le choix est retenu sur cet appareil. */
function replierContexte() {
  const ctx = $('#context'), boutonPlus = ctx.querySelector('.ctx-more'), desc = ctx.querySelector('.cd');
  if (!boutonPlus || !desc) return;
  const deplie = stockageLocal.get('contextOpen', false);
  ctx.classList.add('folded');
  const long = desc.scrollHeight > desc.clientHeight + 1 || !!ctx.querySelector('.cx');
  ctx.classList.toggle('folded', !deplie);
  boutonPlus.hidden = !long;
  desc.inert = estTelephone() && long && !deplie; // replié sur un téléphone : on ne peut pas atteindre au clavier les liens des lignes cachées ; Plus le déplie
  boutonPlus.textContent = deplie ? 'Moins' : 'Plus';
  boutonPlus.setAttribute('aria-expanded', String(deplie));
  boutonPlus.onclick = () => { stockageLocal.set('contextOpen', !deplie); replierContexte(); };
}
function afficherFilAriane() {
  const c = $('#crumbs'); c.innerHTML = '';
  const chemin = lignee(etatVue.container).slice().reverse();
  chemin.forEach((element, idx) => {
    if (idx) { const s = document.createElement('span'); s.className = 'sep'; s.textContent = '/'; c.appendChild(s); }

function afficherLegende(vue) {
  const totaux = {}; for (const l of G.links) totaux[l.k] = (totaux[l.k] || 0) + 1;
  const ici = {}; for (const e of vue.edges) ici[e.k] = (ici[e.k] || 0) + 1;
  const L = $('#legend'); L.innerHTML = '<div class="lh">Afficher les liens</div>';
  const ligneTechnique = () => { const etiquette = document.createElement('label'); etiquette.className = 'tech' + (modeTechnique() ? '' : ' off'); etiquette.innerHTML = `<input type="checkbox" ${modeTechnique() ? 'checked' : ''}><span>Afficher le détail technique</span><span class="tog" style="margin-left:auto"></span>`; etiquette.querySelector('input').onchange = (ev) => reglerModeTechnique(ev.target.checked); return etiquette; };
  let nbDesactives = 0;

    etiquette.querySelector('input').onchange = (ev) => { etatVue.kinds[k] = ev.target.checked; stockageLocal.set('kinds', etatVue.kinds); afficherVue({ keepTransform: true }); };

  const fb = $('#filters-btn');

function afficherPanneau() {
  const sel = etatVue.selected;
  let html;
  if (sel && typeof sel === 'object' && sel.edge) html = panneauLien(etatVue.edgeEls.get(sel.edge)?.e);
  else if (sel && sel.startsWith('x:')) html = panneauElement(entiteConnecteur(sel), true);
  else if (sel && sel.startsWith('m:')) html = panneauElement('f:' + sel.slice(2));
  else if (sel) html = panneauElement(sel);
  else html = etatVue.container === 'root' ? panneauApercu() : etatVue.container === 'q:answer' ? panneauReponse() : panneauElement(etatVue.container);
  // les extensions ajoutent des sections : 'overview' sur le panneau du projet, 'item' sur un élément sélectionné ou ouvert
  const endroit = sel && typeof sel === 'object' ? null : sel ? 'item' : etatVue.container === 'root' ? 'overview' : etatVue.container === 'q:answer' ? null : 'item';
  const cible = sel && typeof sel === 'string' ? (sel.startsWith('x:') ? entiteConnecteur(sel) : sel.startsWith('m:') ? 'f:' + sel.slice(2) : sel) : etatVue.container;
  const sortiesExt = [];
  if (perso.panel) { html = perso.panel.html; sortiesExt.push(...(perso.panel.bind ? [{ bind: perso.panel.bind, whole: true }] : [])); }
  else if (endroit) for (const fn of ext.sections[endroit]) {
    try {
      const r = fn(cible);
      if (!r) continue;
      const o = typeof r === 'string' ? { html: r } : r;
      sortiesExt.push(o);
      const bloc = `<div data-ext="${sortiesExt.length - 1}">${o.html || ''}</div>`;
      // { top: true } : juste après la section d'en-tête du panneau au lieu de la fin
      const second = o.top ? html.indexOf('<div class="sec"', 1) : -1;
      html = second > 0 ? html.slice(0, second) + bloc + html.slice(second) : html + bloc;
    } catch (e) { console.error('floorplan extension', e); }
  }
  panneau.innerHTML = html || '';
  panneau.classList.toggle('meme-sujet', !sel && !perso.panel);
  sortiesExt.forEach((o, i) => { try { o.bind?.(o.whole ? panneau : panneau.querySelector(`[data-ext="${i}"]`)); } catch (e) { console.error('floorplan extension', e); } });
  panneau.scrollTop = 0;
  panneau.querySelectorAll('[data-go]').forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); localiser(a.dataset.go); }));
  panneau.querySelectorAll('[data-open]').forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); ouvrirBloc(a.dataset.open); }));
  panneau.querySelectorAll('[data-flow]').forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); lancerParcours(a.dataset.flow); }));
  panneau.querySelectorAll('[data-sel]').forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); choisir(a.dataset.sel); centrerSur(a.dataset.sel); }));
  panneau.querySelector('[data-goroot]')?.addEventListener('click', () => allerVers('root'));
  panneau.querySelectorAll('[data-copy]').forEach((a) => a.addEventListener('click', () => { navigator.clipboard?.writeText(a.dataset.copy); a.textContent = '✓'; }));
  emettre('panel', { selected: sel, container: etatVue.container });
}

// Parties de premier niveau, regroupées sous des noms compréhensibles plutôt que de simples points de couleur.
const GROUPES_SYSTEMES = [

  { label: 'Dans les coulisses', hint: 'serveurs, tâches de fond, code partagé', kinds: ['service', 'worker', 'library', 'feature', 'data', 'config'] },
  { label: 'Services extérieurs', hint: 'd\'autres entreprises dont ton application dépend', kinds: ['external'] },

function sectionParties(racines) {
  const places = new Set();
  const parties = GROUPES_SYSTEMES.map((g) => {
    const elements = racines.filter((t) => g.kinds.includes(infosBloc(t).kind));
    elements.forEach((t) => places.add(t));
    return elements.length ? `<div class="group-h">${h(g.label)}<span class="gd">${h(g.hint)}</span></div><div class="list">${elements.map((t) => ligneDe(t, infosBloc(t).kind === 'external' ? '' : modeTechnique() && !PLAN && statsDe(t)?.files ? formaterNombre(statsDe(t).loc) + ' lignes' : statsDe(t)?.files ? accorder(statsDe(t).files, 'fichier') : '')).join('')}</div>` : '';
  });
  const reste = racines.filter((t) => !places.has(t));
  if (reste.length) parties.push(`<div class="group-h">Autres</div><div class="list">${reste.map((t) => ligneDe(t)).join('')}</div>`);
  return `<div class="sec"><h3>Parties <span class="c">${racines.length}</span></h3>${parties.join('')}</div>`;
}

function connexions(element) {
  const propres = new Set(lignee(element));
  const dedans = (x) => lignee(x).includes(element);
  const voisinDe = (x) => { const ch = lignee(x); const idx = ch.findIndex((y) => propres.has(y)); return ch[idx - 1] || x; };
  const sortie = new Map(), entree = new Map();
  for (const l of G.links) {
    const ia = dedans(l.a), ib = dedans(l.b);
    if (ia === ib) continue;
    const voisin = voisinDe(ia ? l.b : l.a);
    const m = ia ? sortie : entree;
    const cle = voisin + '|' + l.k;
    const cur = m.get(cle) || { peer: voisin, k: l.k, w: 0 };
    cur.w += l.w; m.set(cle, cur);
  }
  const rangees = (m) => [...m.values()].sort((a, b) => b.w - a.w).map((c) => ligneDe(c.peer, `${LIBELLE_TYPE[c.k]} · ${c.w}`, `var(--k-${c.k})`));
  return { out: rangees(sortie), inn: rangees(entree) };
}

function panneauElement(element, viaConnecteur) {
  const i = infosBloc(element);
  let html = `<div class="sec">${enteteFiche(i)}`;
  const actions = [];
  if (ouvrable(element) && etatVue.container !== element) actions.push(`<button class="btn soft" data-open="${h(element)}">${pictoI('drill')}Ouvrir</button>`);
  if (viaConnecteur || (parentsParId.get(element) !== etatVue.container && etatVue.container !== element)) actions.push(`<button class="btn soft" data-go="${h(element)}">Montrer sur la carte</button>`);
  if (i.type === 'node' || i.type === 'dir') {
    const n = i.n, s = statsDe(element);
    if (n?.details) html += n.details.split(/\n\n+/).map((p) => `<p class="pd" style="margin-top:8px">${h(p)}</p>`).join('');
    if (n?.paths?.length || i.d) html += boiteChemin(i.d ? i.d.path + '/' : n.paths.join('  '));
    if (actions.length) html += `<div class="actions">${actions.join('')}</div>`;
    html += '</div>';
    if (s?.files) {
      const langages = Object.entries(n?.stats.langs || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const tot = langages.reduce((a, [, v]) => a + v, 0) || 1;
      const couleurs = ['#a78bfa', '#38bdf8', '#34d399', '#fbbf24', '#f472b6'];
      const nr = routes.filter((r) => lignee('f:' + r.f).includes(element)).length;
      html += `<div class="sec"><div class="stats"><div><b>${formaterNombre(s.files)}</b><span>${PLAN ? 'fichiers prévus' : 'fichiers'}</span></div>${PLAN ? '' : `<div><b>${formaterNombre(s.loc)}</b><span>lignes</span></div>`}<div><b>${nr}</b><span>adresses du serveur</span></div></div>
        ${langages.length && !PLAN ? `<div class="bar">${langages.map(([, v], k) => `<span style="flex:${v};background:${couleurs[k]}"></span>`).join('')}</div><div class="legend-row">${langages.map(([l, v], k) => `<span><span class="dot" style="background:${couleurs[k]}"></span>${h(l)} ${Math.round((v / tot) * 100)}%</span>`).join('')}</div>` : ''}</div>`;
    }
    if (n?.packages?.length || n?.hosts?.length || n?.tags?.length) html += `<div class="sec"><h3>Repéré grâce à</h3><div class="tags">${[...n.packages.map((p) => 'paquet ' + p), ...n.hosts.map((p) => 'hôte ' + p), ...n.tags.map((t) => '#' + t)].map((t) => `<span class="tag">${h(t)}</span>`).join('')}</div></div>`;
    html += sectionListe('À l\'intérieur', (fils.get(element) || []).filter((k) => !k.startsWith('f:')).map((k) => ligneDe(k)));
    const c = connexions(element);
    html += sectionListe('Utilisé par', c.inn) + sectionListe('Dépend de', c.out);
    const fl = (i.d ? i.d.files : G.files.filter((f) => lignee('f:' + f.p).includes(element))).slice().sort((a, b) => b.loc - a.loc);
    html += sectionListe(PLAN ? 'Fichiers prévus' : 'Fichiers', fl.map((f) => ligneDe('f:' + f.p, PLAN ? '' : formaterNombre(f.loc))), fl.length, 25);
  } else if (i.type === 'file' || i.type === 'module') {
    const f = i.f, fid = 'f:' + f.p, url = urlEditeur(f.p);
    if (f.note) html += `<div class="callout">${h(f.note)}</div>`;
    if (f.tooLarge) html += `<div class="callout">Trop gros pour que Floorplan le lise : ce qu’il utilise, ses adresses du serveur et d’éventuels secrets n’ont pas été vérifiés. Demande à Claude ou à Codex de mettre à jour la carte avec une limite de taille de fichier plus grande pour l’inclure.</div>`;
    html += boiteChemin(f.p);
    if (url) actions.push(`<a class="btn soft" href="${url}">${pictoI('open')}Ouvrir dans l'éditeur</a>`);
    if (actions.length) html += `<div class="actions">${actions.join('')}</div>`;
    const proprietaire = noeudsParId.get(f.n);
    html += `</div><div class="sec"><div class="stats">${PLAN ? `<div><b>${formaterNombre(G.links.filter((l) => l.a === fid).length)}</b><span>utilise</span></div>` : `<div><b>${formaterNombre(f.loc)}</b><span>lignes</span></div>`}<div><b>${(routesParFichier.get(f.p) || []).length}</b><span>adresses du serveur</span></div><div><b>${modeTechnique() ? (f.s || []).length : formaterNombre(G.links.filter((l) => l.b === 'f:' + f.p).length)}</b><span>${modeTechnique() ? 'exports' : 'utilisé par'}</span></div></div>
      ${proprietaire ? `<div class="list" style="margin-top:12px">${ligneDe('n:' + proprietaire.id, 'module')}</div>` : ''}</div>`;
    html += sectionListe('Adresses du serveur', (routesParFichier.get(f.p) || []).map((ri) => ligneRoute(ri)), undefined, 60);
    const liensEntrants = G.links.filter((l) => l.b === fid), liensSortants = G.links.filter((l) => l.a === fid);
    const ligneLien = (l, autre) => ligneDe(autre, l.calls?.length ? accorder(l.calls.length, 'appel') : LIBELLE_TYPE[l.k], `var(--k-${l.k})`);
    html += sectionListe('Utilisé par', liensEntrants.map((l) => ligneLien(l, l.a)));
    html += sectionListe('Dépend de', liensSortants.map((l) => ligneLien(l, l.b)));
    const gestionnaires = new Set((routesParFichier.get(f.p) || []).map((ri) => routes[ri].h));
    if (modeTechnique()) html += sectionListe('Exports', (f.s || []).map((s, k) => [s, k]).filter(([s]) => !gestionnaires.has(s[0])).map(([s, k]) => `<a class="row" ${parentsParId.has(`s:${f.p}#${k}`) ? `data-go="s:${h(f.p)}#${k}"` : ''}><span class="dot" style="background:var(--n-symbol)"></span><span class="rt"><div class="rn" style="font-family:var(--mono);font-size:12px">${h(s[0])}</div>${s[4] ? `<div class="rd">${h(s[4])}</div>` : ''}</span><span class="rc">${h(s[1])} · L${s[2]}</span></a>`), undefined, 60);
  } else if (i.type === 'route') {
    const r = i.r, url = urlEditeur(r.f, r.l);
    html += boiteChemin(`${r.m} ${r.p}`);
    if (url) actions.push(`<a class="btn soft" href="${url}">${pictoI('open')}Ouvrir le gestionnaire</a>`);
    html += `<div class="actions">${actions.join('')}</div></div>`;
    html += `<div class="sec"><h3>Géré par</h3><div class="list">${ligneDe('f:' + r.f, r.h ? h(r.h) + '()' : '')}</div></div>`;
    const ri = routes.indexOf(r);
    const appelants = new Map();
    for (const l of G.links) { const n = (l.calls || []).filter(([x]) => x === ri).length; if (n) appelants.set(l.a, (appelants.get(l.a) || 0) + n); }
    html += appelants.size ? sectionListe('Appelé depuis', [...appelants.entries()].map(([a, n]) => ligneDe(a, accorder(n, 'appel'), 'var(--k-http)')))
      : `<div class="sec"><h3>Appelé depuis</h3><p class="pd empty">Aucun appel trouvé dans le code analysé. Elle peut être appelée par un système extérieur, ou par une adresse construite pendant l'exécution.</p></div>`;
  } else if (i.type === 'symbol') {
    const url = urlEditeur(i.f.p, i.s[2]);
    html += boiteChemin(`${i.f.p}:${i.s[2]}`);
    if (url) actions.push(`<a class="btn soft" href="${url}">${pictoI('open')}Ouvrir dans l'éditeur</a>`);
    html += `<div class="actions">${actions.join('')}</div></div>`;
    html += `<div class="sec"><h3>Défini dans</h3><div class="list">${ligneDe('f:' + i.f.p)}</div></div>`;
    const importateurs = G.links.filter((l) => l.b === 'f:' + i.f.p && (l.names || []).some((nm) => nm === i.s[0] || (nm === 'default' && i.s[3])));
    html += sectionListe('Importé par', importateurs.map((l) => ligneDe(l.a)));
  } else html += '</div>';
  return html;
}

function panneauLien(e) {
  if (!e) return '';

}

const indexRecherche = [
  ...G.nodes.map((n) => ({ id: 'n:' + n.id, name: n.label, desc: n.summary || '', path: n.id, kind: n.kind, w: 4 })),
  ...G.files.map((f) => ({ id: 'f:' + f.p, name: f.name, desc: f.d || '', path: f.p, kind: 'file', w: 3 })),
  ...routes.map((r, i) => ({ id: 'r:' + i, name: r.name, desc: r.d || '', path: `${r.m} ${r.p}`, kind: 'route', w: 3 })),
  ...G.files.flatMap((f) => (f.s || []).map((s, i) => ({ id: `s:${f.p}#${i}`, name: s[0], desc: s[4] || '', path: f.p, kind: pictoSymbole(s[1]), w: 1 }))).filter((x) => parentsParId.has(x.id)),
];
const elPalette = $('#palette'), champRecherche = $('#search'), zoneResultats = $('#results');
let indexActif = 0, resultatsRecherche = [];
function openPalette() { elPalette.classList.add('open'); champRecherche.value = ''; lancerRecherche(); setTimeout(() => champRecherche.focus(), 0); }
function fermerPalette() { elPalette.classList.remove('open'); }
function lancerRecherche() {
  const termes = champRecherche.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let notes = [];
  if (!termes.length) notes = (fils.get('root') || []).map((id) => [1, indexRecherche.find((x) => x.id === id)]).filter((x) => x[1]);
  else for (const it of indexRecherche) {
    if (!modeTechnique() && (it.kind === 'function' || it.kind === 'class')) continue;
    const n = it.name.toLowerCase(), d = it.desc.toLowerCase(), p = it.path.toLowerCase();
    let s = 0;
    for (const t of termes) {
      const sc = n === t ? 30 : n.startsWith(t) ? 20 : n.includes(t) ? 12 : p.includes(t) ? 6 : d.includes(t) ? 4 : 0;
      if (!sc) { s = 0; break; }
      s += sc;
    }
    if (s) notes.push([s + it.w * 2 - n.length * 0.02, it]);
  }
  resultatsRecherche = notes.sort((a, b) => b[0] - a[0]).slice(0, 40).map((x) => x[1]);
  indexActif = 0;
  zoneResultats.innerHTML = resultatsRecherche.map((it, i) => {
    const ii = infosBloc(it.id);
    const ic = it.kind === 'route' ? `<span class="method" style="--m:${varMethode(ii.r.m)}">${h(ii.r.m)}</span>` : `<span class="ico" style="--c:${couleurBloc(ii)}">${picto(clePicto(ii))}</span>`;
    return `<div class="r${i === 0 ? ' active' : ''}" data-i="${i}">${ic}<span class="rt"><div class="rn">${h(it.name)}</div><div class="rd">${h(it.desc || it.path)}</div></span><span class="rk">${h(it.kind === 'route' ? ii.r.p : nomGenre(it.kind))}</span></div>`;
  }).join('') || '<div class="empty">Aucun résultat</div>';
  zoneResultats.querySelectorAll('.r').forEach((r) => { r.addEventListener('mousedown', (ev) => { ev.preventDefault(); choisirResultat(+r.dataset.i); }); r.addEventListener('mousemove', () => activer(+r.dataset.i)); });
}
function activer(i) { indexActif = i; zoneResultats.querySelectorAll('.r').forEach((r, k) => r.classList.toggle('active', k === i)); zoneResultats.children[i]?.scrollIntoView({ block: 'nearest' }); }
function choisirResultat(i) { const it = resultatsRecherche[i]; if (!it) return; fermerPalette(); localiser(it.id); }
champRecherche.addEventListener('input', lancerRecherche);
champRecherche.addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); activer(borner(indexActif + (ev.key === 'ArrowDown' ? 1 : -1), 0, resultatsRecherche.length - 1)); }
  else if (ev.key === 'Enter') choisirResultat(indexActif);
  else if (ev.key === 'Escape') fermerPalette();
});
elPalette.addEventListener('mousedown', (ev) => { if (ev.target === elPalette) fermerPalette(); });
$('#search-btn').onclick = openPalette;

// Les parcours personnalisés sont conservés à côté de la carte quand elle est servie (parcours-perso.json, intégré par construire.mjs),
// sinon dans ce navigateur. Les étapes sont enregistrées avec des références stables pour survivre aux reconstructions.
const CLE_PARCOURS = `flows:${G.projet.name}`;
const refStable = (id) => id.startsWith('r:') ? `route:${routes[+id.slice(2)].m} ${routes[+id.slice(2)].p}` : id.startsWith('s:') ? `sym:${symboleDe(id).f.p}#${symboleDe(id).s[0]}` : id;
function refVivante(ref) {
  if (ref.startsWith('route:')) { const i = routes.findIndex((r) => `${r.m} ${r.p}` === ref.slice(6)); return i < 0 ? null : 'r:' + i; }
  if (ref.startsWith('sym:')) { const p = ref.slice(4, ref.lastIndexOf('#')), nm = ref.slice(ref.lastIndexOf('#') + 1); const i = fichiersParChemin.get(p)?.s?.findIndex((s) => s[0] === nm) ?? -1; return i < 0 ? null : `s:${p}#${i}`; }
  return Q.exists(ref) ? ref : null;
}
const versEnregistre = (fl) => ({ id: fl.id, title: fl.title, description: fl.description, steps: fl.steps.map((s) => ({ ref: refStable(s.ref), note: s.note })) });
function ajouterParcours(enregistre) {
  if (G.parcours.some((x) => x.id === enregistre.id)) return null;
  const etapes = (enregistre.steps || []).map((s) => ({ ref: refVivante(s.ref), note: s.note || '' })).filter((s) => s.ref);
  if (etapes.length < 2) return null;
  const fl = { id: enregistre.id, title: enregistre.title || 'Parcours', description: enregistre.description || '', steps: etapes, custom: true };
  G.parcours.push(fl);
  return fl;
}
const apiServeur = (methode, corps) => fetch('/api/flows', { method: methode, headers: { 'content-type': 'application/json', 'x-floorplan-token': window.FLOORPLAN_SERVER.token }, ...(corps ? { body: JSON.stringify(corps) } : {}) }).then((r) => r.json());
async function enregistrerParcoursPerso(fl) {
  if (window.FLOORPLAN_SERVER) { try { await apiServeur('POST', { flow: versEnregistre(fl) }); return; } catch {} }
  stockageLocal.set(CLE_PARCOURS, [...stockageLocal.get(CLE_PARCOURS, []).filter((x) => x.id !== fl.id), versEnregistre(fl)]);
}
async function supprimerParcoursPerso(id) {
  G.parcours = G.parcours.filter((x) => x.id !== id);
  if (etatVue.flow?.f.id === id) finirParcours();
  if (window.FLOORPLAN_SERVER) { try { await apiServeur('DELETE', { id }); } catch {} }
  stockageLocal.set(CLE_PARCOURS, stockageLocal.get(CLE_PARCOURS, []).filter((x) => x.id !== id));
  afficherMenuParcours();
}
async function chargerParcoursPerso() {
  for (const s of stockageLocal.get(CLE_PARCOURS, [])) ajouterParcours(s);
  if (window.FLOORPLAN_SERVER) { try { for (const s of (await apiServeur('GET')).parcours || []) ajouterParcours(s); } catch {} }
  afficherMenuParcours();
}

// Servi par serveur.mjs : recharge sur place quand la carte est reconstruite (la vue vit dans le hash de l'URL). Si le
// serveur redémarre, le jeton de cet onglet est périmé et le flux se ferme pour de bon : on attend donc son retour.
(function rechargementAuto() {
  const S = window.FLOORPLAN_SERVER;
  if (!S || typeof EventSource === 'undefined') return;
  const recharger = () => { afficherMessage('Carte mise à jour'); setTimeout(() => location.reload(), 500); };
  const es = new EventSource('/api/events?token=' + encodeURIComponent(S.token));
  es.addEventListener('reload', recharger);
  es.onerror = () => {
    if (es.readyState !== EventSource.CLOSED) return; // une connexion coupée se rétablit toute seule
    // chaque seconde au début (un redémarrage dure à peu près autant), puis toutes les 5 s, pendant 30 minutes au plus
    const t0 = Date.now();
    const verifier = () => fetch('/', { cache: 'no-store' }).then((r) => (r.ok ? recharger() : suivant()), suivant);
    const suivant = () => { const age = Date.now() - t0; if (age < 30 * 60000) setTimeout(verifier, age < 30000 ? 1000 : 5000); };
    verifier();
  };
})();

async function demanderParcours(demande) {
  if (!etatQuestion.engine) { reglerAvertissement(window.FLOORPLAN_SERVER ? 'cli_missing' : 'no_engine'); return; }
  if (etatQuestion.busy) annulerQuestion();
  reglerOccupe(true);
  etatQuestion.ctl = new AbortController();
  const libelle = `Nouveau parcours : ${demande}`;
  const lignes = ['Réflexion…'];
  const progression = (t) => { lignes.push(t); montrerProgression(libelle, lignes.slice(-6)); };
  montrerProgression(libelle, lignes);
  try {
    const brut = etatQuestion.engine === 'cli' ? await demanderViaCli(demande, progression, 'flow') : await demanderViaApp(demande, progression, 'flow');
    const etapes = (brut.steps || []).map((s) => ({ ref: String(s.id || ''), note: String(s.note || '') })).filter((s) => Q.exists(s.ref));
    if (etapes.length < 2) throw { code: 'flow_empty', message: `${AGENT.name} n'a pas trouvé assez d'étapes reliées pour cela. Essaie de dire où il commence ou où il se termine.` };
    const fl = { id: 'custom-' + Date.now().toString(36), title: String(brut.title || demande).slice(0, 80), description: String(brut.description || ''), steps: etapes, custom: true };
    G.parcours.push(fl);
    await enregistrerParcoursPerso(fl);
    afficherMenuParcours();
    afficherFeuille(libelle, `<p>Ajouté aux Parcours : <strong>${h(fl.title)}</strong> (${accorder(fl.steps.length, 'étape')}).${fl.description ? ' ' + h(fl.description) : ''}</p>
      <div class="sheet-actions"><button class="btn soft" data-play="${h(fl.id)}">${pictoI('right')}Rejouer</button></div>`);
    feuille.querySelector('[data-play]').onclick = () => lancerParcours(fl.id);
    lancerParcours(fl.id);
  } catch (e) {
    if (e?.name === 'AbortError') montrerEchec(libelle, 'cancelled');
    else montrerEchec(libelle, e?.code || 'upstream_error', e?.message || String(e));
  } finally { reglerOccupe(false); }
}
const elLegende = $('#legend');
$('#flows-btn').onclick = (ev) => { ev.stopPropagation(); elLegende.classList.remove('open'); fm.classList.toggle('open'); };
$('#filters-btn').onclick = (ev) => { ev.stopPropagation(); fm.classList.remove('open'); elLegende.classList.toggle('open'); };
elLegende.addEventListener('click', (ev) => ev.stopPropagation());
window.addEventListener('click', () => { fm.classList.remove('open'); elLegende.classList.remove('open'); });
function lancerParcours(id) { const f = G.parcours.find((x) => x.id === id); if (!f) return; etatVue.flow = { f, i: 0 }; etapeParcours(); }
function finirParcours() { etatVue.flow = null; document.body.classList.remove('in-flow'); $('#flowbar').hidden = true; vp.querySelectorAll('.flowfx').forEach((x) => x.remove()); choisir(null); }
function conteneurCommun(a, b) {
  const cb = new Set(lignee(b));
  for (const x of lignee(a)) if (cb.has(x)) return (x === a || x === b) ? (parentsParId.get(x) || 'root') : x;
  return 'root';
}
function etapeParcours() {
  document.body.classList.add('in-flow'); // les visites guidées des réponses et la visite guidée jouent aussi des parcours
  const { f, i } = etatVue.flow;
  const a = f.steps[i].ref, b = f.steps[i + 1]?.ref;
  const conteneur = b ? conteneurCommun(a, b) : parentsParId.get(a) || 'root';
  const barre = $('#flowbar'); barre.hidden = false;
  barre.innerHTML = `<div class="ft"><div class="fk">${h(f.title)} · étape ${i + 1} sur ${f.steps.length}</div><b>${h(infosBloc(a).name)}</b>${b ? ` <span>→</span> <b>${h(infosBloc(b).name)}</b>` : ''}<br><span>${h(f.steps[i].note)}</span><div class="dots">${f.steps.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div></div>
    <button class="btn icon" id="fl-prev" ${i === 0 ? 'disabled' : ''}>${pictoI('left')}</button><button class="btn icon" id="fl-next">${pictoI(i >= f.steps.length - 1 ? 'x' : 'right')}</button><button class="btn icon" id="fl-x" title="Quitter">${pictoI('x')}</button>`;
  $('#fl-prev').onclick = () => { etatVue.flow.i--; etapeParcours(); };
  $('#fl-next').onclick = () => { if (etatVue.flow.i >= f.steps.length - 1) finirParcours(); else { etatVue.flow.i++; etapeParcours(); } };
  $('#fl-x').onclick = finirParcours;
  // la visite guidée d'une réponse se joue sur le tableau de la réponse lui-même
  if (etatVue.flow.inPlace) { if (etatVue.container === 'q:answer') surlignerParcours(a, b); else allerVers('q:answer', { after: () => surlignerParcours(a, b) }); }
  else allerVers(conteneur, { after: () => surlignerParcours(a, b) });
}
function surlignerParcours(a, b) {
  vp.querySelectorAll('.flowfx').forEach((x) => x.remove());
  const ctx = { container: etatVue.container, vis: new Set(etatVue.view.visible), cchain: new Set(lignee(etatVue.container)) };
  const pa = projeter(a, ctx)?.item, pb = b ? projeter(b, ctx)?.item : null;
  svg.classList.add('dim');
  for (const g of etatVue.chipEls.values()) g.classList.remove('hl', 'sel');
  for (const x of etatVue.edgeEls.values()) { x.g.classList.remove('hl'); x.pg.classList.remove('hl'); }
  listeColonne.querySelectorAll('.col-bloc.sel').forEach((x) => x.classList.remove('sel'));

// mini markdown : paragraphes, listes, **gras**, `code`, références [[id]]
function pastilleRef(id) {
  const b = Q.brief(id);
  if (!b) return h(id);
  const ii = infosBloc(id);
  return `<span class="ref" data-ref="${h(id)}" style="--c:${couleurBloc(ii)}"><i></i>${h(b.name)}</span>`;
}
function md(src) {
  const enLigne = (s) => h(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\[\[([^\]]+)\]\]/g, (_, id) => pastilleRef(id.replace(/&#39;|&quot;/g, '').trim()));
  const sortie = [];
  let liste = null;
  for (const brut of String(src || '').split('\n')) {
    const ligne = brut.trim();
    const li = /^([-*]|\d+\.)\s+(.*)$/.exec(ligne);
    if (li) { const balise = /\d/.test(li[1]) ? 'ol' : 'ul'; if (liste !== balise) { if (liste) sortie.push(`</${liste}>`); sortie.push(`<${balise}>`); liste = balise; } sortie.push(`<li>${enLigne(li[2])}</li>`); continue; }
    if (liste) { sortie.push(`</${liste}>`); liste = null; }
    if (ligne) sortie.push(`<p>${enLigne(ligne.replace(/^#+\s*/, ''))}</p>`);
  }
  if (liste) sortie.push(`</${liste}>`);
  return sortie.join('');
}

// ---------- modifier un plan depuis la carte (servi par serveur.mjs) ----------
// La bulle de questions reçoit un interrupteur Demander / Modifier. Une modification part vers l'agent, le serveur vérifie et enregistre le
// plan mis à jour et redessine la carte, chaque onglet ouvert se recharge, et les blocs nouveaux et modifiés sont mis en valeur
// comme travail récent. Ce qui a changé est gardé pendant ce rechargement dans sessionStorage, avec un bouton Annuler.
const CLE_CHANGEMENT = 'floorplan-change';
// un serveur dont le moteur ne peut pas respecter le format du plan répond change: false
const changementPossible = () => PLAN && etatQuestion.engine === 'cli' && window.FLOORPLAN_SERVER?.change !== false;

const memoireChangement = { get: () => { try { return JSON.parse(sessionStorage.getItem(CLE_CHANGEMENT) || 'null'); } catch { return null; } }, set: (v) => { try { v ? sessionStorage.setItem(CLE_CHANGEMENT, JSON.stringify(v)) : sessionStorage.removeItem(CLE_CHANGEMENT); } catch {} } };
async function demanderChangement(question) {
  reglerOccupe(true);
  etatQuestion.ctl = new AbortController();
  const lignes = ['Lecture du plan…'];
  const progression = (t) => { lignes.push(t); montrerProgression(question, lignes.slice(-6)); };
  montrerProgression(question, lignes);
  try {
    const r = await demanderViaCli(question, progression, 'change');
    memoireChangement.set({ question, title: r.title, summary: r.summary, followups: r.followups || [], undo: r.undo, at: Date.now() });
    progression('Redessin de la carte');
    setTimeout(() => location.reload(), 4000); // au cas où l'avis de rechargement n'arrive pas
  } catch (e) {
    if (e?.name === 'AbortError') montrerEchec(question, 'cancelled');
    else if (e?.code === 'change_invalid' || e?.code === 'busy') afficherFeuille(question, `<p class="err">${h(String(e.message).split('\n')[0])}</p>${md(String(e.message).split('\n').slice(1).join('\n'))}`);

  } finally { reglerOccupe(false); }
}
/** Après le rechargement que provoque une modification : ce qui a changé, avec Annuler et les blocs modifiés sur un seul tableau. */
function montrerResultatChangement() {
  const c = memoireChangement.get();
  memoireChangement.set(null);
  if (!c) return;
  if (c.undone) { afficherMessage('Modification annulée'); return; }
  if (Date.now() - c.at > 120000) return;
  const elements = (G.recent?.items || []).filter((x) => parentsParId.has(x.id)).map((x) => ({ id: x.id, note: x.note }));
  fermerFeuille(); // un bloc dans le lien ouvre la feuille de détails sur un téléphone, et elle se poserait par-dessus ce résumé
  afficherFeuille(c.question, `<p><strong>${h(c.title || 'Plan mis à jour')}</strong></p>${md(c.summary)}
    <div class="sheet-actions">${elements.length ? `<button class="btn soft" data-cr="show">${pictoI('search')}Voir ${accorder(elements.length, 'modification')}</button>` : ''}<button class="btn soft" data-cr="undo">${pictoI('left')}Annuler</button></div>
    ${c.followups?.length ? `<div class="followups">${c.followups.slice(0, 3).map((f) => `<button data-cf="${h(f)}">${h(f)}</button>`).join('')}</div>` : ''}`);
  feuille.querySelector('[data-cr="show"]')?.addEventListener('click', () => montrerVueReponse({ title: c.title || 'Ce qui a changé', question: c.question, items: elements }));
  feuille.querySelector('[data-cr="undo"]').addEventListener('click', async (ev) => {
    ev.currentTarget.disabled = true;
    const r = await fetch('/api/plan/undo', { method: 'POST', headers: { 'x-floorplan-token': window.FLOORPLAN_SERVER.token } }).then((x) => x.json()).catch(() => ({ ok: false, error: 'Impossible de joindre le serveur de la carte.' }));
    if (!r.ok) { afficherMessage(r.error || 'Impossible d’annuler'); ev.currentTarget.disabled = false; return; }
    memoireChangement.set({ undone: true, at: Date.now() });
    setTimeout(() => location.reload(), 4000);
  });
  feuille.querySelectorAll('[data-cf]').forEach((b) => b.onclick = () => { reglerModeQuestion('change'); champQuestion.value = b.dataset.cf; envoyerQuestion(); });
}

async function demanderViaCli(question, progression, mode = 'ask') {
  const res = await fetch('/api/ask', {
    method: 'POST', signal: etatQuestion.ctl.signal,
    headers: { 'content-type': 'application/json', 'x-floorplan-token': window.FLOORPLAN_SERVER.token },
    body: JSON.stringify({ question, mode, session: mode === 'ask' ? etatQuestion.session : undefined }),
  });
  if (!res.ok || !res.body) throw { code: 'cli_error', message: `Réponse du serveur : ${res.status}` };
  const lecteur = res.body.getReader(), dec = new TextDecoder();
  let tampon = '', reponse = null;
  for (;;) {
    const { value: valeur, done: fini } = await lecteur.read();
    if (fini) break;
    tampon += dec.decode(valeur, { stream: true });
    let i;
    while ((i = tampon.indexOf('\n\n')) >= 0) {
      const bloc = tampon.slice(0, i); tampon = tampon.slice(i + 2);
      const ev = /^event: (.*)$/m.exec(bloc)?.[1], donnees = JSON.parse(/^data: (.*)$/m.exec(bloc)?.[1] || 'null');
      if (ev === 'progress') progression(donnees.text);
      else if (ev === 'answer') { reponse = donnees; if (mode === 'ask') etatQuestion.session = donnees.session || etatQuestion.session; }
      else if (ev === 'failure') throw donnees;
    }
  }
  if (!reponse) throw { code: 'cli_error', message: 'La ligne de commande s\'est arrêtée sans réponse.' };
  return reponse;
}

async function demanderViaApp(question, progression, mode = 'ask') {
  const tronquer = (v) => { const s = JSON.stringify(v); return s.length > 24000 ? s.slice(0, 24000) + '…(tronqué)' : s; };
  const outils = [
    { name: 'find_items', description: 'Cherche dans la carte avec des mots. Renvoie jusqu\'à 15 éléments {id, type, name, description, path}. kind limite éventuellement les résultats à module, file, endpoint ou symbol.',
      inputSchema: { type: 'object', properties: { query: { type: 'string' }, kind: { type: 'string', enum: ['module', 'file', 'endpoint', 'symbol'] } }, required: ['query'] },
      execute: ({ query: requete, kind: genre }) => { progression(`Recherche dans la carte de « ${requete} »`); return tronquer(Q.find(String(requete), genre ? String(genre) : undefined)); } },
    { name: 'get_item', description: "Détails d'un élément de la carte à partir de son id : sa description, son module parent, ses enfants et fichiers, ses adresses du serveur (endpoints), ses exports, et ce dont il dépend et ce qui l'utilise (avec les ids).",
      inputSchema: { type: 'object', properties: { id: { type: 'string' } }, required: ['id'] },
      execute: ({ id }) => { const b = Q.brief(String(id)); progression(`Examen de ${b ? b.name : id}`); return tronquer(Q.show(String(id))); } },
    { name: 'dependency_path', description: 'Plus courte chaîne d\'imports et d\'appels HTTP depuis n\'importe quoi à l\'intérieur d\'un élément jusqu\'à n\'importe quoi à l\'intérieur d\'un autre. Renvoie les étapes avec leurs ids.',
      inputSchema: { type: 'object', properties: { from: { type: 'string' }, to: { type: 'string' } }, required: ['from', 'to'] },
      execute: ({ from: depuis, to: vers }) => { progression('Recherche d\'un chemin de dépendances'); return tronquer(Q.path(String(depuis), String(vers))); } },
  ];
  const estParcours = mode === 'flow';
  const consignes = `${estParcours ? floorplanConsignesParcours(G, 'app') : floorplanConsignesQuestion(G, 'app')}\nLe JSON doit respecter ce schéma :\n${JSON.stringify(estParcours ? FLOORPLAN_SCHEMA_PARCOURS : FLOORPLAN_SCHEMA_REPONSE)}\n\nAperçu de la carte :\n${tronquer(Q.overview())}`;
  const echanges = [{ role: 'user', content: consignes }, ...(estParcours ? [] : etatQuestion.turns.slice(-6)), { role: 'user', content: question }];
  const reponse = await etatQuestion.sample.json(echanges, { tools: outils, signal: etatQuestion.ctl.signal });
  if (estParcours) return reponse || {};
  etatQuestion.turns.push({ role: 'user', content: question }, { role: 'assistant', content: JSON.stringify({ title: reponse?.title, answer: reponse?.answer }) });
  return reponse || {};
}

  champQuestion.placeholder = !etatQuestion.engine ? 'Questions indisponibles' : etatQuestion.mode === 'change' ? (etatQuestion.context.length ? 'Que faut-il changer ici ?' : 'Demande une modification, par ex. « prévois aussi les remboursements »…') : etatQuestion.context.length ? 'Pose une question à ce sujet…' : `Pose une question sur ${G.projet.name}…`;
  boutonEnvoyer.disabled = !etatQuestion.engine;
}

async function envoyerQuestion() {
  if (etatQuestion.busy) { annulerQuestion(); return; }
  const idsContexte = etatQuestion.context.slice();
  let question = champQuestion.value.trim();
  if (!question && idsContexte.length) question = idsContexte.length === 1 ? `Qu'est-ce que ${infosBloc(idsContexte[0]).name} et comment s'insère-t-il dans l'ensemble ?` : `Quel est le lien entre ${idsContexte.map((id) => infosBloc(id).name).join(' et ')} ?`;
  if (!question || !etatQuestion.engine) return;
  champQuestion.value = '';
  etatQuestion.context = []; afficherPuces();
  if (etatQuestion.mode === 'change') return demanderChangement(idsContexte.length ? `${question}\n\nCela concerne : ${idsContexte.map((id) => `${id} (${infosBloc(id).name})`).join(', ')}.` : question);
  const affiche = question;
  // ce que Claude voit : la question plus les éléments épinglés, par id, pour qu'il parte d'eux
  if (idsContexte.length) question += `\n\nConcentre-toi sur ces éléments de la carte : ${idsContexte.map((id) => `${id} (${infosBloc(id).name})`).join(', ')}.`;
  reglerOccupe(true);
  etatQuestion.ctl = new AbortController();
  const lignes = ['Réflexion…'];
  const progression = (t) => { lignes.push(t); montrerProgression(affiche, lignes.slice(-6)); };
  montrerProgression(affiche, lignes);
  try {
    const brut = etatQuestion.engine === 'cli' ? await demanderViaCli(question, progression) : await demanderViaApp(question, progression);
    montrerReponse(brut, affiche);
  } catch (e) {
    if (e?.name === 'AbortError') montrerEchec(affiche, 'cancelled');
    else montrerEchec(affiche, e?.code || 'upstream_error', e?.message || String(e), e?.text && e.code !== 'invalid_json' ? e.text : '');
  } finally { reglerOccupe(false); }
}

window.addEventListener('keydown', (ev) => {
  if (elPalette.classList.contains('open') || ev.target.tagName === 'INPUT') return;
  if (ev.key === '/' || (ev.key === 'k' && (ev.metaKey || ev.ctrlKey))) { ev.preventDefault(); openPalette(); }
  else if (ev.key === 'Backspace') { ev.preventDefault(); monterNiveau(); }
  else if (ev.key === 'Escape') {
    if (!menuContextuel.hidden || fm.classList.contains('open') || elLegende.classList.contains('open')) { fermerMenu(); fm.classList.remove('open'); elLegende.classList.remove('open'); }

  boite.querySelectorAll('[data-mi]').forEach((b) => b.onclick = () => { const a = actions[+b.dataset.mi]; if (a.onClick?.(fermer) !== false && !a.keepOpen) fermer(); });
